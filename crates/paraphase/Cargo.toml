[package]
name = "paraphase"
version = "0.2.0"
edition = "2021"
authors = ["Xiao Chen, <xchen@pacificbiosciences.com>", "Daniel N. Baker <dbaker@pacificbiosciences.com>"]
description = "Paraphase: HiFi-based caller for highly similar paralogous genes"
license-file = "../../LICENSE.md"

[dependencies]
env_logger = "0.10.1"
log = "0.4.20"
rust-htslib = { version = "0.49.0", default-features = false }
counter = "0.5.7"
lazy_static = "1.4.0"
serde = { version = "1.0.104", features = ["derive"] }
serde_json = {version = "1.0.48", features = ["std"]}
serde_yaml = "0.9.27"
simple-error = "0.3"
regex = "1.10.2"
vstr = { path = "../vstr/" }
itertools = "0.10.5"
static_assertions = "1.1.0"
indexmap = "2.1"
anyhow = "1.0.75"
trimothy = "0.2.2"
fnv = "1.0.7"
assertables = "7.0"
tempfile = "3.3.0"
statrs = "0.16.0"
fma = {version = "0.1.0", optional = true}
url = "2.4.1"
bytecount = "0.6.7"
thiserror = "1.0.50"
minimap2 = { version = "0.1.23", features = ["simde", "htslib"]}
rand = {version = "0.8.5", features = ["small_rng"]}
threadpool = "1.8.1"
slurp = "1.0.1"

[dependencies.petgraph]
version = "0.6.4"
features = ["serde-1"]

[dev-dependencies]
predicates = "2.0.0"
assert_cmd = "^2.0.11"

[features]
default = ["long_tests"]
long_tests = []
nightly = ["fma"]
profile = []
curl = ["rust-htslib/curl"]
paraphase_2_2 = []
map_hifi = []
decomp = []
