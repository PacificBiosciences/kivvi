[package]
name = "kivvi"
version = "1.1.0"
edition = "2021"
build = "build.rs"
default-run = "kivvi"
license-file = "LICENSE.md"
authors = ["Xiao Chen <xchen@pacificbiosciences.com>"]
repository = "https://github.com/PacificBiosciences/kivvi"
description = "Kivvi: KIV2/D4Z4 genotyper using HiFi WGS data"

[workspace]
members = ["crates/paraphase"]

[build-dependencies]
vergen = { version = "8.2.4", features = ["git", "gitcl"] }

[dependencies]
clap = { version = "=4.0", features = ["derive"] }
chrono = "0.4.24"
log = "0.4.17"
env_logger = "0.9.1"
lazy_static = "1.4.0"
itertools = "0.10.5"
rust-htslib = { version = "0.49.0", default-features = false, features = ["static"] }
minimap2 = { version = "0.1.23", features = ["simde", "htslib", "static"]}
simple-error = "0.3"
static_assertions = "1.1.0"
serde_json = {version = "1.0.48", features = ["std", "arbitrary_precision"]}
serde = { version = "1.0.104", features = ["derive"] }
regex = "1.3.9"
rand = {version = "0.8.5", features = ["small_rng"]}
tempfile = "3.3.0"
counter = "0.5.7"
bit-vec = "0.6.3"
priority-queue = "1.2.3"
rustc-hash = "1.1.0"
strum_macros = "0.27.1"
thiserror = "1.0.56"
paraphase = { path = "crates/paraphase" }
